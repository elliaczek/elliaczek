<svg width="700" height="90" viewBox="0 0 700 90" xmlns="http://www.w3.org/2000/svg">

  <style>
    .text {
      font-family: "Trebuchet MS", sans-serif;
      font-size: 16px;
    }

    .first {
      fill: #2a563d;
    }

    .second {
      fill: #6a2865;
    }

    /* Pierwsza linijka */
    .line1 {
      clip-path: inset(0 100% 0 0);
      animation: typeLine1 8s steps(43, end) infinite;
    }

    /* Druga linijka */
    .line2 {
      clip-path: inset(0 100% 0 0);
      animation: typeLine2 8s steps(32, end) infinite;
    }

    /* Odpowiedź od prawej */
    .answer {
      clip-path: inset(0 0 0 100%);
      animation: typeAnswer 8s steps(25, end) infinite;
    }

    @keyframes typeLine1 {
      0% {
        clip-path: inset(0 100% 0 0);
        opacity: 1;
      }

      5% {
        clip-path: inset(0 0 0 0);
        opacity: 1;
      }

