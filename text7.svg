<svg width="700" height="100" viewBox="0 0 700 100">

<style>
.text{font-family:"Trebuchet MS",sans-serif;font-size:16px}
.first{fill:#378229}.second{fill:#722a82}

.line1,.line2,.answer{
  clip-path:inset(0 100% 0 0);
  animation:type forwards;
}

.line1{animation-duration:3.2s;animation-timing-function:steps(43)}
.line2{animation-duration:2.6s;animation-delay:3.2s;animation-timing-function:steps(32)}
.answer{animation-duration:1.8s;animation-delay:5.8s;animation-timing-function:steps(25)}

@keyframes type{
  to{clip-path:inset(0)}
}
</style>

<text x="0" y="25" class="text first line1">like, obviously, we don't like each other.</text>

<text x="0" y="50" class="text first line2">you've done some things to me that-</text>

<text x="700" y="75" text-anchor="end" class="text second answer">when have i not liked you?</text>

</svg>
