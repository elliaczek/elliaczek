<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="100"
     viewBox="0 0 700 100">

  <style>
    .text {
      font-family: "Trebuchet MS", sans-serif;
      font-size: 16px;
    }

    .first {
      fill: #2a563d;
    }

    .second {
      fill: #6a2865;
    }

    .reveal1 {
      animation: type1 3.2s steps(43, end) forwards;
    }

    .reveal2 {
      animation: type2 2.6s steps(32, end) 3.25s forwards;
    }

    .reveal3 {
      animation: type3 1.8s steps(25, end) 5.85s forwards;
    }

    @keyframes type1 {
      from { width: 0px; }
      to { width: 700px; }
    }

    @keyframes type2 {
      from { width: 0px; }
      to { width: 700px; }
    }

    @keyframes type3 {
      from { width: 0px; }
      to { width: 700px; }
    }
  </style>

  <mask id="mask1">
    <rect class="reveal1"
          x="0" y="0"
          width="0" height="100"
          fill="white"/>
  </mask>

  <mask id="mask2">
    <rect class="reveal2"
          x="0" y="0"
          width="0" height="100"
          fill="white"/>
  </mask>

  <mask id="mask3">
    <rect class="reveal3"
          x="0" y="0"
          width="0" height="100"
          fill="white"/>
  </mask>

  <text x="0" y="25"
        class="text first"
        mask="url(#mask1)">
    like, obviously, we don't like each other.
  </text>

  <text x="0" y="50"
        class="text first"
        mask="url(#mask2)">
    you've done some things to me that-
  </text>

  <text x="700" y="75"
        text-anchor="end"
        class="text second"
        mask="url(#mask3)">
    when have i not liked you?
  </text>

</svg>
