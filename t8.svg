<svg width="700" height="100" viewBox="0 0 700 100">

  <style>
    .text {
      font-family: "Trebuchet MS", sans-serif;
      font-size: 16px;
    }

    .first {
      fill: #2a563d;
    }

    .second {
      fill: #6a2865;
    }

    .line1 {
      clip-path: inset(0 100% 0 0);
      animation:
        typing1 4s steps(43, end) forwards,
        hide1 0.1s 7.5s forwards;
    }

    .line2 {
      clip-path: inset(0 100% 0 0);
      animation:
        typing2 3.2s steps(32, end) 4s forwards,
        hide2 0.1s 7.5s forwards;
    }

    .answer {
      clip-path: inset(0 100% 0 0);
      animation:
        typingAnswer 2.2s steps(25, end) 7.6s forwards,
        hideAnswer 0.1s 11s forwards;
    }

    @keyframes typing1 {
      from {
        clip-path: inset(0 100% 0 0);
      }
      to {
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes typing2 {
      from {
        clip-path: inset(0 100% 0 0);
      }
      to {
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes typingAnswer {
      from {
        clip-path: inset(0 100% 0 0);
      }
      to {
        clip-path: inset(0 0 0 0);
      }
    }

    @keyframes hide1 {
      to {
        opacity: 0;
      }
    }

    @keyframes hide2 {
      to {
        opacity: 0;
      }
    }

    @keyframes hideAnswer {
      to {
        opacity: 0;
      }
    }
  </style>


  <text x="0" y="25" class="text first line1">
    like, obviously, we don't like each other.
  </text>


  <text x="0" y="50" class="text first line2">
    you've done some things to me that-
  </text>


  <text x="700" y="75" text-anchor="end" class="text second answer">
    when have i not liked you?
  </text>

</svg>
