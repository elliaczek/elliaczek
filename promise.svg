<svg xmlns="http://www.w3.org/2000/svg"
     width="700"
     height="50"
     viewBox="0 0 700 50">

  <style>
    .text {
      font-family: "Trebuchet MS", sans-serif;
      font-size: 16px;
      font-style: italic;
      fill: #9700bc;
      animation: floatFade 3.5s ease-in-out infinite;
    }

    @keyframes floatFade {
      0% {
        opacity: 0.35;
        transform: translateY(4px);
      }

      50% {
        opacity: 1;
        transform: translateY(-3px);
      }

      100% {
        opacity: 0.35;
        transform: translateY(4px);
      }
    }
  </style>

  <text x="350"
        y="30"
        text-anchor="middle"
        class="text">
    u good? jaden r u good?
  </text>

</svg>
